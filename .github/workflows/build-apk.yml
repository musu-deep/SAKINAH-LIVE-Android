name: Build SAKINAH LIVE APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk SAKINAH-LIVE-Android-v1.4.apk
          sha256sum SAKINAH-LIVE-Android-v1.4.apk > SAKINAH-LIVE-Android-v1.4.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAKINAH-LIVE-APK
          path: |
            SAKINAH-LIVE-Android-v1.4.apk
            SAKINAH-LIVE-Android-v1.4.apk.sha256
          if-no-files-found: error
          retention-days: 30
